name: Compilar GS Connect Windows (x64)

on:
  workflow_dispatch:
  push:
    branches:
      - master

env:
  RUST_VERSION: "1.75"
  SCITER_RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_ROOT: "C:\\vcpkg"
  VCPKG_DEFAULT_HOST_TRIPLET: "x64-windows-static"
  UPLOAD_ARTIFACT: "true"
  PUBLISH_UPDATE_METADATA: "false"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-RustDeskTempTopMostWindow:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  build-gsconnect-windows:
    name: Compilar GS-Connect.exe (x86_64)
    needs: [build-RustDeskTempTopMostWindow, generate-bridge]
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Patch hbb_common config.rs for GS Connect and Quick Support
        shell: bash
        run: |
          python3 .github/scripts/patch_client_qs.py

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        id: flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace engine with custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          $flutterBin = (Get-Command flutter.bat).Source
          $flutterRoot = (Get-Item $flutterBin).Directory.Parent.FullName
          $engineDest = "$flutterRoot\\bin\\cache\\artifacts\\engine\\windows-x64-release"
          if (-not (Test-Path $engineDest)) {
            New-Item -ItemType Directory -Force -Path $engineDest | Out-Null
          }
          Copy-Item -Path "windows-x64-release\\*" -Destination $engineDest -Recurse -Force

      - name: Patch flutter
        run: |
          $flutterBin = (Get-Command flutter.bat).Source
          $flutterRoot = (Get-Item $flutterBin).Directory.Parent.FullName
          Copy-Item -Path ".github\\patches\\flutter_3.24.4_dropdown_menu_enableFilter.diff" -Destination $flutterRoot
          Push-Location $flutterRoot
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
          Pop-Location

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: pwsh
        run: |
          & "C:\\vcpkg\\vcpkg.exe" install --triplet x64-windows-static --x-install-root="C:\\vcpkg\\installed"

      - name: Build GS Connect
        run: |
          python3 .\\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\\deviceinstaller64.exe", "usbmmidd_v2\\deviceinstaller.exe", "usbmmidd_v2\\usbmmidd.bat"
          mv -Force .\\usbmmidd_v2 ./rustdesk
          if (Test-Path ./rustdesk/rustdesk.exe) {
            Move-Item -Force ./rustdesk/rustdesk.exe ./rustdesk/GS-Connect.exe
          }

      - name: Copy Runner.res to portable packer
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res")
          if [ -n "$runner_res" ]; then
            echo "Found Runner.res: $runner_res"
            cp $runner_res ./libs/portable/Runner.res
          fi

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@v4
        with:
          name: topmostwindow-artifacts-x64
          path: "./rustdesk"

      - name: Build self-extracted executables (GS-Connect.exe & GS-Connect-Suporte.exe)
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/GS-Connect.exe
          popd
          mkdir -p ./SignOutput
          cp ./target/release/rustdesk-portable-packer.exe ./SignOutput/GS-Connect.exe
          cp ./target/release/rustdesk-portable-packer.exe ./SignOutput/GS-Connect-Suporte.exe
          cp ./target/release/rustdesk-portable-packer.exe ./SignOutput/GS-Connect-Setup.exe
          ls -lh ./SignOutput/

      - name: Upload GS Connect Windows Binaries
        uses: actions/upload-artifact@v4
        with:
          name: GS-Connect-Windows-x64
          path: |
            ./SignOutput/GS-Connect.exe
            ./SignOutput/GS-Connect-Suporte.exe
            ./SignOutput/GS-Connect-Setup.exe
